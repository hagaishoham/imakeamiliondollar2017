<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סרטון אנימציה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .scene.active {
            opacity: 1;
        }

        /* Scene 1 - Intro */
        .scene-1 {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        .scene-1 .title {
            font-size: 4rem;
            color: #fff;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.5s;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .scene-1 .subtitle {
            font-size: 1.5rem;
            color: #a8d8ea;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 1.2s;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(168, 216, 234, 0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        /* Scene 2 - Features */
        .scene-2 {
            background: linear-gradient(135deg, #0f3460, #533483, #e94560);
        }

        .scene-2 .feature-list {
            list-style: none;
            text-align: center;
        }

        .scene-2 .feature-item {
            font-size: 2rem;
            color: #fff;
            margin: 20px 0;
            opacity: 0;
            transform: translateX(-50px);
        }

        .scene-2 .feature-item:nth-child(1) { animation: slideIn 0.8s ease forwards; animation-delay: 0.3s; }
        .scene-2 .feature-item:nth-child(2) { animation: slideIn 0.8s ease forwards; animation-delay: 0.8s; }
        .scene-2 .feature-item:nth-child(3) { animation: slideIn 0.8s ease forwards; animation-delay: 1.3s; }
        .scene-2 .feature-item:nth-child(4) { animation: slideIn 0.8s ease forwards; animation-delay: 1.8s; }

        /* Scene 3 - Stats */
        .scene-3 {
            background: linear-gradient(135deg, #e94560, #f39422, #ffd460);
        }

        .stats-container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box {
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
        }

        .stat-box:nth-child(1) { animation: popIn 0.6s ease forwards; animation-delay: 0.3s; }
        .stat-box:nth-child(2) { animation: popIn 0.6s ease forwards; animation-delay: 0.7s; }
        .stat-box:nth-child(3) { animation: popIn 0.6s ease forwards; animation-delay: 1.1s; }

        .stat-number {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-top: 10px;
        }

        /* Scene 4 - Call to Action */
        .scene-4 {
            background: linear-gradient(135deg, #2d3436, #636e72);
        }

        .scene-4 .cta-text {
            font-size: 3rem;
            color: #fff;
            text-align: center;
            opacity: 0;
            animation: pulse 2s ease infinite;
            animation-delay: 0.5s;
        }

        .scene-4 .cta-button {
            margin-top: 40px;
            padding: 20px 60px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #e94560, #f39422);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 1s;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .scene-4 .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.6);
        }

        /* Scene 5 - Outro */
        .scene-5 {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .scene-5 .thanks {
            font-size: 3.5rem;
            color: #fff;
            opacity: 0;
            animation: fadeUp 1.5s ease forwards;
            animation-delay: 0.3s;
        }

        .scene-5 .logo {
            width: 100px;
            height: 100px;
            margin-top: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #f39422);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            opacity: 0;
            animation: popIn 0.8s ease forwards;
            animation-delay: 1s;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #e94560, #f39422, #ffd460);
            transition: width 0.3s ease;
            z-index: 100;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: #fff;
        }

        /* Animations */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* Geometric shapes */
        .geo-shape {
            position: absolute;
            border: 2px solid rgba(255,255,255,0.1);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Scene 1: Intro -->
        <div class="scene scene-1 active" id="scene-1">
            <div class="particles" id="particles-1"></div>
            <h1 class="title">ברוכים הבאים</h1>
            <p class="subtitle">הסרטון שלכם מתחיל כאן</p>
        </div>

        <!-- Scene 2: Features -->
        <div class="scene scene-2" id="scene-2">
            <ul class="feature-list">
                <li class="feature-item">&#10024; עיצוב מדהים</li>
                <li class="feature-item">&#9889; אנימציות חלקות</li>
                <li class="feature-item">&#127912; צבעים מרהיבים</li>
                <li class="feature-item">&#128640; חוויה מושלמת</li>
            </ul>
        </div>

        <!-- Scene 3: Stats -->
        <div class="scene scene-3" id="scene-3">
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-number" data-target="1000">0</div>
                    <div class="stat-label">משתמשים</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" data-target="500">0</div>
                    <div class="stat-label">פרויקטים</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" data-target="99">0</div>
                    <div class="stat-label">% שביעות רצון</div>
                </div>
            </div>
        </div>

        <!-- Scene 4: Call to Action -->
        <div class="scene scene-4" id="scene-4">
            <h2 class="cta-text">מוכנים להתחיל?</h2>
            <button class="cta-button">בואו נתחיל!</button>
        </div>

        <!-- Scene 5: Outro -->
        <div class="scene scene-5" id="scene-5">
            <h2 class="thanks">תודה שצפיתם!</h2>
            <div class="logo">&#9733;</div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progress-bar"></div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn" id="prev-btn">&#9664;</button>
            <button class="control-btn" id="play-btn">&#9654;</button>
            <button class="control-btn" id="next-btn">&#9654;</button>
        </div>
    </div>

    <script>
        const scenes = document.querySelectorAll('.scene');
        const progressBar = document.getElementById('progress-bar');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let currentScene = 0;
        let isPlaying = false;
        let autoPlayInterval = null;
        const sceneDuration = 4000; // 4 seconds per scene

        // Create particles for scene 1
        function createParticles() {
            const container = document.getElementById('particles-1');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (4 + Math.random() * 4) + 's';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        function goToScene(index) {
            if (index < 0 || index >= scenes.length) return;

            scenes[currentScene].classList.remove('active');
            // Reset animations by cloning
            const oldScene = scenes[index];
            currentScene = index;
            scenes[currentScene].classList.add('active');

            // Update progress bar
            const progress = ((currentScene + 1) / scenes.length) * 100;
            progressBar.style.width = progress + '%';

            // Animate numbers in scene 3
            if (currentScene === 2) {
                animateNumbers();
            }
        }

        function nextScene() {
            if (currentScene < scenes.length - 1) {
                goToScene(currentScene + 1);
            } else {
                goToScene(0);
            }
        }

        function prevScene() {
            if (currentScene > 0) {
                goToScene(currentScene - 1);
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';

            if (isPlaying) {
                autoPlayInterval = setInterval(nextScene, sceneDuration);
            } else {
                clearInterval(autoPlayInterval);
            }
        }

        function animateNumbers() {
            const numbers = document.querySelectorAll('.stat-number');
            numbers.forEach(num => {
                const target = parseInt(num.getAttribute('data-target'));
                const duration = 2000;
                const step = target / (duration / 16);
                let current = 0;

                const timer = setInterval(() => {
                    current += step;
                    if (current >= target) {
                        current = target;
                        clearInterval(timer);
                    }
                    num.textContent = Math.floor(current);
                }, 16);
            });
        }

        // Event listeners
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextScene);
        prevBtn.addEventListener('click', prevScene);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.key === 'ArrowRight' ? nextScene() : prevScene();
            }
            if (e.key === ' ') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Initialize
        createParticles();
        progressBar.style.width = (1 / scenes.length * 100) + '%';

        // Auto-start after 1 second
        setTimeout(() => {
            togglePlay();
        }, 1000);
    </script>
</body>
</html>
